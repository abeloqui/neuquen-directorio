<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Directorio Comunitario de Neuquén</title>
<meta name="description" content="Comedores, salud, comercios, ferias y servicios de Neuquén Capital. Sin publicidad, sin rastreo, sin cuentas.">
<meta name="theme-color" content="#0e5a6b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <h1>Neuquén <small>directorio comunitario</small></h1>
  <input id="q" type="search" placeholder="Buscar comedor, farmacia, barrio…" aria-label="Buscar">
  <button id="btnLoc" class="btn">Usar mi ubicación</button>
  <button id="btnTema" class="btn" aria-label="Cambiar entre modo claro y oscuro">◐</button>
</header>
<nav id="chips" aria-label="Categorías"></nav>
<div class="tools">
  <select id="est" aria-label="Estado">
    <option value="todos">Abiertos y cerrados</option><option value="abierto">Abierto ahora</option>
    <option value="pronto">Cierra pronto</option><option value="cerrado">Cerrado</option>
  </select>
  <select id="orden" aria-label="Ordenar">
    <option value="nombre">Orden A–Z</option><option value="distancia">Más cerca primero</option>
  </select>
  <span id="cuenta"></span>
</div>
<main>
  <section id="lista"><p id="aviso" role="status"></p><ul id="res"></ul></section>
  <div id="map" aria-label="Mapa de lugares"></div>
  <dialog id="ficha" aria-label="Detalle del lugar"></dialog>
</main>
<footer>Sin publicidad, sin rastreo, sin cuentas. Tu ubicación no sale de tu dispositivo. Espacios culturales: <a href="https://portaldatosabiertos.neuquen.gov.ar/dataset/espacios-culturales-del-neuquen" target="_blank" rel="noopener">ODAFyC, Datos Abiertos del Neuquén</a> (CC BY 4.0). · <a href="admin.html">Administrar</a></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="js/shared.js"></script>
<script src="js/app.js"></script>
</body>
</html>
